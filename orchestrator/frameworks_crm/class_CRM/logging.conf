[loggers]
keys=root,crm

[handlers]
keys=fileHandler, consoleHandler

[formatters]
keys=logFormatter

[logger_root]
level=DEBUG
handlers=consoleHandler

[logger_crm]
level=DEBUG
handlers=fileHandler
qualname=crm
propagate=1

[handler_fileHandler]
class=logging.handlers.RotatingFileHandler
level=DEBUG
args=('%(logfilepath)s',2000,100)
formatter=logFormatter

[handler_consoleHandler]
class=StreamHandler
level=DEBUG
formatter=logFormatter
args=(sys.stdout,)

[formatter_logFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
datefmt=%Y-%m-%d %H:%M:%S